local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  update_frequency: 2.0
  publish_frequency: 1.0
  transform_tolerance: 0.5

  # Dynamic obstacle avoidance is disabled: there is no /scan obstacle layer.
  # The saved map is used in a rolling window so DWA still avoids mapped walls.
  static_map: false
  rolling_window: true
  width: 4.0
  height: 4.0
  resolution: 0.10
  track_unknown_space: false

  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  static_layer:
    enabled: true
    map_topic: /map
    subscribe_to_updates: false
    track_unknown_space: false

  inflation_layer:
    enabled: true
    inflation_radius: 0.35
    cost_scaling_factor: 5.0
