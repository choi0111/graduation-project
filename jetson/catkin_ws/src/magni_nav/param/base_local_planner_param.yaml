DWAPlannerROS:
  # Keep planner limits close to the STM32 motor controller limits.
  # Use a moderate corridor cruise speed. Final room alignment and the short
  # fixed-distance approach are controlled separately at lower speeds.
  max_vel_x: 0.08
  # Include zero so DWA can build a valid dynamic window from rest.  With the
  # 3 Hz controller and the old 0.04 m/s^2 limit, the first reachable speed
  # was below the old 0.02 m/s minimum, so straight trajectories were rejected
  # while curved trajectories could still pass the angular-speed threshold.
  min_vel_x: 0.0

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.08
  # Reject effectively stationary trajectories. With both minimum translation
  # and rotation set to zero, DWA could select a floating-point near-zero
  # angular command forever while an active goal remained several metres away.
  min_vel_trans: 0.015
  trans_stopped_vel: 0.01

  # A 0.08 rad/s limit gives a 0.75 m turn radius at maximum translation while
  # remaining well below the STM32 firmware's 0.20 rad/s clamp.
  max_vel_theta: 0.08
  min_vel_theta: 0.02
  theta_stopped_vel: 0.01

  # At 3 Hz these limits expose reachable non-zero samples in the first DWA
  # cycle while the STM32 still applies its own PWM ramp.
  acc_lim_x: 0.10
  acc_lim_theta: 0.12
  acc_lim_y: 0.0

  # Named destinations include a measured door-facing orientation.
  yaw_goal_tolerance: 0.20
  # Center poses are coarse staging areas for the 0.74 m-wide platform. Final
  # room approaches temporarily tighten this value to 0.15 m in navi.py.
  xy_goal_tolerance: 1.00
  latch_xy_goal_tolerance: true

  sim_time: 2.0
  sim_granularity: 0.05
  angular_sim_granularity: 0.05
  vx_samples: 7
  vy_samples: 1
  vth_samples: 11

  # Follow the global plan strongly. The cost term only represents saved-map
  # walls, because the local costmap does not subscribe to /scan obstacles.
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.20
  forward_point_distance: 0.15
  twirling_scale: 1.0

  stop_time_buffer: 0.3
  # The physical robot footprint does not change with speed. Dynamic scaling previously
  # enlarged its already padded footprint by up to 20% in the corridor.
  scaling_speed: 0.08
  max_scaling_factor: 0.0
  oscillation_reset_dist: 0.10
  prune_plan: true
  meter_scoring: true
  holonomic_robot: false
